[project]
name = "spa-service-log"
version = "0.1.0"
description = "Lake Spa service log backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pytest>=8.3.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "spa-shared",
    "bcrypt>=5.0.0",
    "greenlet>=3.5.0",
    "psycopg[binary]>=3.1",
    "slowapi>=0.1.9",
]

[tool.uv.sources]
spa-shared = { git = "https://github.com/qiuzan2001/spa-python-shared.git", tag = "v0.1.1" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"